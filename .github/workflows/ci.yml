name: Python and PostgreSQL CI

on:
  push:
    branches:
      - main
      - feat/mvp-steps-10-11
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: weather_test
          POSTGRES_USER: weather_test
          POSTGRES_PASSWORD: weather_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weather_test -d weather_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WEATHER_DB_HOST: localhost
      WEATHER_DB_PORT: 5432
      WEATHER_DB_NAME: weather_test
      WEATHER_DB_USER: weather_test
      WEATHER_DB_PASSWORD: weather_test_only
      WEATHER_TEST_DB_RESET: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install the pinned Airflow test runtime
        run: >-
          python -m pip install apache-airflow==2.9.2
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.9.2/constraints-3.10.txt
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: >-
          python -c "import ast, pathlib; files = [*pathlib.Path('scripts').rglob('*.py'),
          *pathlib.Path('tests').rglob('*.py')]; [ast.parse(path.read_text(encoding='utf-8'),
          filename=str(path)) for path in files]"
      - name: Run offline and PostgreSQL tests
        run: python -m pytest -q
